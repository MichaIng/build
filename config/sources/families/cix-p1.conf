declare -g LINUXFAMILY="cix-p1"
declare -g ARCH="arm64"
declare -g BOOTCONFIG="none"
declare -g UEFI_GRUB_TIMEOUT=3
declare -g SERIALCON="" # Disable automatic console= parameter additions
declare -g INSTALL_ARMBIAN_FIRMWARE=no
declare -g KERNEL_BUILD_DTBS="no" # ACPI boot: do not build DTBs
# Compressed EFI kernel image, installed as /boot/vmlinuz-<release>. Requires GRUB 2.12.
declare -g KERNEL_IMAGE_TYPE="vmlinuz.efi"
declare -g KERNEL_INSTALL_TYPE="zinstall"

enable_extension "grub"
declare -g BOOT_LOGO="no" # Disable boot logo/splash parameters that grub extension adds

case $BRANCH in
	current)
		declare -g KERNEL_MAJOR_MINOR="6.18"
		;;
	edge)
		declare -g KERNEL_MAJOR_MINOR="7.1"
		;;
esac

declare -g LINUXCONFIG="linux-${LINUXFAMILY}-${BRANCH}"
declare -g KERNELPATCHDIR="archive/cix-${KERNEL_MAJOR_MINOR}"

function post_family_tweaks__cix_acpi_mesa_backports() {
	display_alert "Installing mesa-vulkan-drivers from backports" "cix-acpi" "info"

	# Only install on Debian Trixie
	if [[ "${RELEASE}" == "trixie" && "${DISTRIBUTION}" == "Debian" ]]; then
		# Update mesa from backports
		# Note: trixie-backports is already configured by Armbian
		chroot_sdcard_apt_get install -t trixie-backports mesa-vulkan-drivers

		display_alert "mesa-vulkan-drivers installed from trixie-backports" "cix-acpi" "info"
	else
		display_alert "Skipping mesa-vulkan-drivers backports install (not Debian Trixie)" "${RELEASE}" "warn"
	fi
}

# Fetch the CIX VPU driver sources from the latest commit of the mainline branch, for the hooks below
function kernel_copy_extra_sources__cix_p1_vpu_sources() {
	GIT_FIXED_WORKDIR="" GIT_BARE_REPO_FOR_WORKTREE="" GIT_BARE_REPO_INITIAL_BRANCH="" GIT_EXPECTED_SHA1="" \
		fetch_from_repo "https://github.com/cixtech/cix_opensource__vpu_driver" "cix-vpu-driver" "branch:cix_mainline_dev"
	declare -g CIX_P1_VPU_SRC="${SRC}/cache/sources/cix-vpu-driver"
	cd "${kernel_work_dir}" || exit_with_error "Failed to change directory" "${kernel_work_dir}"
}

# Add the VPU driver to the kernel tree, as a patch generated from its sources on every build.
# The patcher applies it first, after the drivers harness patch.
# VPU: drivers/media/platform/cix-vpu, module amvx. It builds like the former DKMS package, including its Debian patches.
function kernel_extra_create_patches__cix_p1_vpu_driver() {
	declare vpu="${CIX_P1_VPU_SRC}"
	[[ -d "${vpu}/driver" ]] || exit_with_error "VPU driver sources not found" "${vpu}"

	declare target_patch_file="${SRC}/cache/patch/kernel-cix-p1/${BRANCH}.patch"
	display_alert "Creating VPU driver patch" "${target_patch_file}" "info"
	run_host_command_logged mkdir -p "${target_patch_file%/*}"

	cd "${kernel_work_dir}" || exit_with_error "Failed to change directory" "${kernel_work_dir}"
	run_host_command_logged git reset --hard "${kernel_git_revision}"
	run_host_command_logged git clean -fd

	# VPU: the driver comes with an in-tree Kbuild file and Kconfig
	declare dst="drivers/media/platform/cix-vpu" patch
	declare -a patches=()
	run_host_command_logged mkdir -p "${dst}"
	run_host_command_logged cp -a "${vpu}/driver/." "${dst}/"
	run_host_command_logged rm -f "${dst}/BUILD.bazel" "${dst}/sconscript" "${dst}/Makefile"
	mapfile -t patches < "${vpu}/debian/patches/series"
	for patch in "${patches[@]}"; do
		[[ -n "${patch}" && "${patch}" != \#* ]] || continue
		display_alert "Applying VPU Debian patch" "${patch}" "info"
		run_host_command_logged git apply -p2 --directory="${dst}" "${vpu}/debian/patches/${patch}"
	done
	sed -i -e 's/---help---/help/' -e 's/^\tdepends on VIDEO_DEV$/\tdepends on VIDEO_DEV\n\tselect VIDEOBUF2_DMA_SG/' "${dst}/Kconfig"
	grep -q 'select VIDEOBUF2_DMA_SG' "${dst}/Kconfig" || exit_with_error "Failed to adjust VPU Kconfig" "${dst}/Kconfig"
	sed -i '0,/^source "drivers\/media\/platform\//s//source "drivers\/media\/platform\/cix-vpu\/Kconfig"\n&/' drivers/media/platform/Kconfig
	grep -q '^source "drivers/media/platform/cix-vpu/Kconfig"' drivers/media/platform/Kconfig || exit_with_error "Failed to add VPU Kconfig" "drivers/media/platform/Kconfig"
	echo 'obj-$(CONFIG_VIDEO_LINLON) += cix-vpu/' >> drivers/media/platform/Makefile

	declare version="${KERNEL_MAJOR_MINOR}" # for the patch signature
	export_changes_as_patch_via_git_format_patch # from drivers-harness.sh: commits all changes, writes ${target_patch_file}
	run_host_command_logged git reset --hard "${kernel_git_revision}"

	# Outer scope variables of kernel_main_patching: space-separated lists, which the patcher applies first
	kernel_drivers_patch_file="${kernel_drivers_patch_file:+${kernel_drivers_patch_file} }${target_patch_file}"
	kernel_drivers_patch_hash="${kernel_drivers_patch_hash:+${kernel_drivers_patch_hash} }cix-p1-vpu"
}

function custom_kernel_config__cix_p1_vpu_driver() {
	opts_m+=("VIDEO_LINLON")
	opts_n+=("VIDEO_LINLON_PRINT_FILE") # like the DKMS package
}

function custom_kernel_config__cix_p1_efi_zboot() {
	opts_y+=("EFI_ZBOOT") # matches KERNEL_IMAGE_TYPE="vmlinuz.efi"
	opts_y+=("KERNEL_ZSTD") # decompresses much faster than XZ
	opts_n+=("KERNEL_GZIP")
}

# Custom kernel config hook to handle firmware
function custom_kernel_config__cix_p1_firmware() {
	if [[ -f .config ]]; then
		### Disable CONFIG_EXTRA_FIRMWARE - firmware will be loaded at runtime from packages
		display_alert "$BOARD" "Disabling embedded firmware (will be loaded at runtime)" "info"
		kernel_config_modifying_hashes+=("CONFIG_EXTRA_FIRMWARE=\"\"")
		run_kernel_make_long_running olddefconfig
	fi
}

# Ship firmware, an initramfs hook and the Xorg config with the linux-image package.
# Firmware goes to /lib/firmware/<kernel version>/: the kernel and initramfs-tools search it before /lib/firmware/.
# This avoids file conflicts with firmware packages and with other kernel packages.
function pre_package_kernel_image__cix_p1_firmware_xorg() {
	declare fw_dir="${tmp_kernel_install_dirs[INSTALL_MOD_PATH]}/lib/firmware/${kernel_version_family}"
	# Latest commit of the default branches. Path below the firmware directory, URL
	declare linux_firmware="https://gitlab.com/kernel-firmware/linux-firmware/-/raw/HEAD"
	declare -a blobs=(
		"dsp_fw.bin https://github.com/cixtech/cix_proprietary__cix_proprietary/raw/HEAD/cix_proprietary-debs/cix-audio-dsp/usr/lib/firmware/dsp_fw.bin"
		"arm/mali/arch12.8/mali_csffw.bin ${linux_firmware}/arm/mali/arch12.8/mali_csffw.bin"
	)
	declare blob path url
	for blob in "${blobs[@]}"; do
		read -r path url <<< "${blob}"
		run_host_command_logged mkdir -p "$(dirname "${fw_dir}/${path}")"
		run_host_command_logged curl --fail --location --retry 3 --silent --show-error -o "${fw_dir}/${path}" "${url}"
	done

	# VPU firmware, from the driver sources of kernel_copy_extra_sources__cix_p1_vpu_sources
	[[ -d "${CIX_P1_VPU_SRC}/firmware-binaries" ]] || exit_with_error "VPU firmware not found" "${CIX_P1_VPU_SRC}/firmware-binaries"
	run_host_command_logged install -Dm644 -t "${fw_dir}" "${CIX_P1_VPU_SRC}"/firmware-binaries/*.fwb

	# Add the Mali firmware to the initramfs, to allow early loading of the GPU driver
	declare hook="${package_directory}/usr/share/initramfs-tools/hooks/cix-p1-mali-firmware"
	run_host_command_logged mkdir -p "${hook%/*}"
	cat <<- 'EOF' > "${hook}"
		#!/bin/sh
		[ "$1" = prereqs ] && exit 0
		. /usr/share/initramfs-tools/hook-functions
		add_firmware arm/mali/arch12.8/mali_csffw.bin || true
	EOF
	run_host_command_logged chmod 755 "${hook}"

	# Xorg's auto-detect failed: 6 DRM cards (card0-5), couldn't determine primary
	# Using fbdev driver bypasses DRM complexities, uses working /dev/fb0 directly
	# fb0 already active at 1920x1080 from console/DRM fbdev emulation
	declare xorg_dir="${package_directory}/usr/share/X11/xorg.conf.d"
	run_host_command_logged mkdir -p "${xorg_dir}"
	cat <<- EOF > "${xorg_dir}/50-cix-display.conf"
		Section "Device"
		      Identifier "CIX FBDev"
		      Driver "fbdev"
		      Option "fbdev" "/dev/fb0"
		EndSection

		Section "Screen"
		      Identifier "Default Screen"
		      Device "CIX FBDev"
		      DefaultDepth 24
		EndSection

		Section "ServerLayout"
		      Identifier "Default Layout"
		      Screen "Default Screen"
		EndSection
	EOF

	# Kernel command line for GRUB. Name per branch avoids file conflicts. The loop avoids duplicates.
	declare grub_dir="${package_directory}/etc/default/grub.d"
	run_host_command_logged mkdir -p "${grub_dir}"
	cat <<- 'EOF' > "${grub_dir}/90-linux-image-${BRANCH}-${LINUXFAMILY}.cfg"
		for p in efi=noruntime clk_ignore_unused nowatchdog watchdog_dev.handle_boot_enabled=0; do
			case " ${GRUB_CMDLINE_LINUX} " in *" ${p} "*) ;; *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+${GRUB_CMDLINE_LINUX} }${p}" ;; esac
		done
		unset -v p
	EOF
}

# Override configure_grub to prevent unwanted cmdline modifications
configure_grub() {
	display_alert "Extension: grub: Configuring GRUB" "UEFI GRUB (cix-p1 override)" "info"

	# Enable Armbian Wallpaper on GRUB
	if [[ "${VENDOR}" == Armbian ]]; then
		display_alert "Extension: grub: Enabling" "Armbian Wallpaper on GRUB" "info"
		mkdir -p "${MOUNT}"/usr/share/desktop-base/
		cat <<- grubWallpaper >> "${MOUNT}"/usr/share/desktop-base/grub_background.sh
			WALLPAPER=/usr/share/images/grub/wallpaper.png
			COLOR_NORMAL=white/black
			COLOR_HIGHLIGHT=black/white
		grubWallpaper
		run_host_command_logged chmod -v +x "${MOUNT}"/usr/share/desktop-base/grub_background.sh
	fi

	# Write GRUB config WITHOUT modifying GRUB_CMDLINE_LINUX_DEFAULT
	display_alert "Extension: grub: GRUB EFI kernel cmdline" "cmdline '${GRUB_CMDLINE_LINUX_DEFAULT}' distro=${UEFI_GRUB_DISTRO_NAME} timeout=${UEFI_GRUB_TIMEOUT}" ""
	cat <<- grubCfgFrag >> "${MOUNT}"/etc/default/grub.d/98-armbian.cfg
		GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT}"
		GRUB_TIMEOUT_STYLE=menu
		GRUB_TIMEOUT=${UEFI_GRUB_TIMEOUT}
		GRUB_DISTRIBUTOR="${UEFI_GRUB_DISTRO_NAME}"
		GRUB_DISABLE_SUBMENU=y
		GRUB_DISABLE_OS_PROBER=false
		GRUB_FONT="/usr/share/grub/unicode.pf2"
		GRUB_GFXPAYLOAD=keep
		GRUB_DISABLE_UUID=false
		GRUB_DISABLE_LINUX_UUID=false
	grubCfgFrag

	if [[ "a${UEFI_GRUB_DISABLE_OS_PROBER}" != "a" ]]; then
		cat <<- grubCfgFragHostSide >> "${MOUNT}"/etc/default/grub.d/98-armbian.cfg
			GRUB_DISABLE_OS_PROBER=${UEFI_GRUB_DISABLE_OS_PROBER}
		grubCfgFragHostSide
	fi

	if [[ "a${UEFI_GRUB_TERMINAL}" != "a" ]]; then
		cat <<- grubCfgFragTerminal >> "${MOUNT}"/etc/default/grub.d/98-armbian.cfg
			GRUB_TERMINAL="${UEFI_GRUB_TERMINAL}"
		grubCfgFragTerminal
	fi
}
