# Amlogic S7D (S905X5M) family. Vendor kernel and U-Boot from Hardkernel.
#
declare -g ARCH="arm64"
declare -g ATF_COMPILE="no" # BL2/BL31/BL32/BL40 come as signed blobs from Hardkernel
declare -g CPUMIN=100000
declare -g CPUMAX=2508000
declare -g GOVERNOR="schedutil"

# Das U-Boot: Hardkernel BSP branch, via Yocto repository
declare -g BOOTSOURCE="https://git.odroid.com/yocto/uboot"
declare -g BOOTBRANCH="branch:odroidc5-v2023.01-bsp-202603"
declare -g BOOTPATCHDIR="u-boot-meson-s7d"
declare -g BOOTSCRIPT="boot-meson-s7d.cmd:boot.cmd"
declare -g BOOTENV_FILE="meson.txt"
declare -g UBOOT_TARGET_MAP=";;build/fip/u-boot.bin.signed:u-boot.bin"

# Signed BL2/BL31/BL32/BL40 blobs, FIP tools and templates, and the AOCPU (BL30) RTOS SDK from Hardkernel, from the BSP branch matching U-Boot.
# Paths below the cache directory, mapped to repositories below MESON_S7D_FIRMWARE_SOURCE. The rtos_sdk paths follow the SDK layout.
declare -g MESON_S7D_FIRMWARE_SOURCE="https://git.odroid.com/yocto"
declare -g MESON_S7D_FIRMWARE_BRANCH="${BOOTBRANCH#branch:}"
declare -g -A MESON_S7D_FIRMWARE_REPOS=(
	[fip]="amlogic/tools/fip"
	[bl2]="firmware/bin/bl2"
	[bl31]="firmware/bin/bl31"
	[bl32]="firmware/bin/bl32"
	[bl40]="firmware/bin/bl40/dummy"
	[templates]="firmware/bin/templates"
	[rtos_sdk/arch/riscv]="rtos_sdk/arch/riscv"
	[rtos_sdk/boards/riscv]="rtos_sdk/boards/riscv"
	[rtos_sdk/build_system]="rtos_sdk/build"
	[rtos_sdk/drivers_aocpu]="rtos_sdk/drivers_aocpu"
	[rtos_sdk/kernel/freertos]="rtos_sdk/freertos"
	[rtos_sdk/lib/libc]="rtos_sdk/libc"
	[rtos_sdk/products/aocpu]="rtos_sdk/product/aocpu"
	[rtos_sdk/scripts]="rtos_sdk/scripts"
	[rtos_sdk/soc/riscv]="rtos_sdk/soc/riscv"
)

# Linux kernel: Hardkernel vendor kernel. Needs the common_drivers and media_modules submodules.
case "${BRANCH}" in
	vendor)
		declare -g KERNELSOURCE="${GITHUB_SOURCE}/hardkernel/linux.git"
		declare -g KERNELBRANCH="branch:odroids7d-6.12.y"
		declare -g KERNELPATCHDIR="meson-s7d-vendor"
		declare -g KERNEL_MAJOR_MINOR="6.12"
		declare -g KERNEL_BTF="no"
		declare -g EXTRAWIFI="no"
		;;
esac

# The U-Boot build needs crc32 (libarchive-zip-perl). The FIP packaging needs xxd. zstd is a common host dependency already.
# BL30 is built with Ubuntu's bare-metal RISC-V GCC and newlib headers, and the RTOS SDK uses CMake and Ninja.
function add_host_dependencies__meson_s7d_uboot() {
	display_alert "Adding libarchive-zip-perl, xxd, cmake, ninja-build, gcc-riscv64-unknown-elf and libnewlib-dev to host dependencies" "for ${BOARD} bootloader build" "debug"
	EXTRA_BUILD_DEPS+=("libarchive-zip-perl" "xxd" "cmake" "ninja-build" "gcc-riscv64-unknown-elf" "libnewlib-dev")
}

# Fetch shallow clones only. The blob repositories hold all Amlogic SoCs, with a history of several GiB, too much for fetch_from_repo.
function fetch_sources_tools__meson_s7d_firmware() {
	declare path dir
	for path in "${!MESON_S7D_FIRMWARE_REPOS[@]}"; do
		dir="${SRC}/cache/sources/meson-s7d-firmware/${path}"
		[[ "${OFFLINE_WORK}" == "yes" && -d "${dir}/.git" ]] && continue
		display_alert "Fetching ${BOARD} firmware sources" "${MESON_S7D_FIRMWARE_REPOS[${path}]} ${MESON_S7D_FIRMWARE_BRANCH}" "info"
		[[ -d "${dir}/.git" ]] || run_host_command_logged git init -q "${dir}"
		run_host_command_logged git -C "${dir}" fetch -q --depth=1 --no-tags "${MESON_S7D_FIRMWARE_SOURCE}/${MESON_S7D_FIRMWARE_REPOS[${path}]}" "${MESON_S7D_FIRMWARE_BRANCH}"
		run_host_command_logged git -C "${dir}" checkout -qf FETCH_HEAD
	done
}

# Build U-Boot, BL33Z and BL30, then pack them with the signed blobs into the FIP, like Hardkernel's fip/s7d/build.sh does with:
# CONFIG_CHIPSET_NAME=s905x5m, CONFIG_AML_{DV,CS}_SIGNING_SCHEME=rsa, CONFIG_AML_BL33_COMPRESS_ENABLE=y, CONFIG_BL2E_96K=y, CONFIG_DYNAMIC_SZ=y
function build_custom_uboot__meson_s7d() {
	display_alert "${BOARD}" "building u-boot, BL33Z, BL30 and FIP" "info"

	declare cross_compile="CROSS_COMPILE=${UBOOT_COMPILER}"
	[[ -n "${CCACHE}" ]] && cross_compile="CROSS_COMPILE=${CCACHE} ${UBOOT_COMPILER}"

	patch_uboot_target
	if [[ "${CREATE_PATCHES}" == "yes" ]]; then
		return 0
	fi

	# U-Boot. The acs.bin target builds u-boot.bin and the device ACS (DDR and board parameters) for BL2.
	run_host_command_logged make mrproper
	run_host_command_logged CCACHE_BASEDIR="$(pwd)" make "${CTHREADS}" "${BOOTCONFIG}" "${cross_compile}"
	run_host_command_logged CCACHE_BASEDIR="$(pwd)" make "${CTHREADS}" "${cross_compile}" acs.bin

	# BL33Z, the ramdump stage, which Hardkernel appends to U-Boot.
	# It links with --fatal-warnings, which binutils 2.39+ trips with an RWX segment warning. LDFLAGS from the environment is appended to.
	run_host_command_logged make -C bl33z PLAT=s7d AARCH=aarch64 distclean
	run_host_command_logged LDFLAGS=--no-warn-rwx-segments make -C bl33z PLAT=s7d AARCH=aarch64 CROSS_COMPILE="${UBOOT_COMPILER}"

	declare fw_src="${SRC}/cache/sources/meson-s7d-firmware" fw_work="${PWD}/build/meson-s7d-firmware" fip_out="${PWD}/build/fip"
	run_host_command_logged rm -rf "${fw_work}" "${fip_out}"
	run_host_command_logged mkdir -p "${fw_work}/bl30" "${fip_out}"

	# BL30: the AOCPU firmware, FreeRTOS on the always-on RISC-V core. Build it from a copy of the SDK, like Hardkernel's superproject has it.
	declare sdk="${fw_work}/bl30/rtos_sdk"
	run_host_command_logged cp -a "${fw_src}/rtos_sdk" "${sdk}"
	run_host_command_logged cp "${sdk}/build_system/CMakeLists.odroid" "${sdk}/CMakeLists.txt"
	run_host_command_logged cp "${sdk}/build_system/Kconfig.odroid" "${sdk}/Kconfig"
	run_host_command_logged ln -s build_system/Makefile "${sdk}/Makefile"

	# Patches in patch/u-boot/${BOOTPATCHDIR}-rtos_sdk/<SDK repository path>/*.patch
	declare patch_dir="${SRC}/patch/u-boot/${BOOTPATCHDIR}-rtos_sdk" path patch
	for path in "${!MESON_S7D_FIRMWARE_REPOS[@]}"; do
		[[ "${path}" == rtos_sdk/* ]] || continue
		for patch in "${patch_dir}/${path#rtos_sdk/}/"*.patch; do
			[[ -f "${patch}" ]] || continue
			display_alert "Applying BL30 patch" "${path#rtos_sdk/}: ${patch##*/}" "info"
			run_host_command_logged git -C "${sdk}/${path#rtos_sdk/}" apply --verbose "${patch}"
		done
	done

	# The SDK expects the xPack riscv-none-embed GCC 8.2 with newlib, which it searches in prebuild/riscv-none-gcc/<version> beside bl30.
	# Provide Ubuntu's riscv64-unknown-elf GCC there instead, under the expected names:
	# - "-misa-spec=2.2" restores the ISA spec of GCC 8.2, which includes Zicsr and Zifencei in "rv32imc".
	# - Ubuntu's newlib headers are not in the default include path.
	# - The SDK links with nano.specs and nosys.specs, and with libm, but none of their content is used. Provide empty ones.
	# - Newer GCC versions raise new warnings, which the SDK treats as errors.
	declare toolchain_regex='riscv-none-gcc/([^[:space:])]+)'
	[[ $(< "${sdk}/soc/riscv/s7d/toolchain_path.cmake") =~ ${toolchain_regex} ]] || exit_with_error "Toolchain version not found" "${sdk}/soc/riscv/s7d/toolchain_path.cmake"
	declare toolchain="${fw_work}/prebuild/riscv-none-gcc/${BASH_REMATCH[1]}/bin" tool
	run_host_command_logged mkdir -p "${toolchain}"
	for tool in ar as ld nm objcopy objdump readelf size strip; do
		run_host_command_logged ln -s "/usr/bin/riscv64-unknown-elf-${tool}" "${toolchain}/riscv-none-embed-${tool}"
	done
	for tool in gcc g++; do
		cat <<- EOF > "${toolchain}/riscv-none-embed-${tool}"
			#!/bin/sh
			exec /usr/bin/riscv64-unknown-elf-${tool} -misa-spec=2.2 -isystem /usr/include/newlib -B "\${0%/*}" "\$@" -Wno-error
		EOF
		run_host_command_logged chmod +x "${toolchain}/riscv-none-embed-${tool}"
	done
	run_host_command_logged touch "${toolchain}/nano.specs" "${toolchain}/nosys.specs"
	run_host_command_logged /usr/bin/riscv64-unknown-elf-ar rc "${toolchain}/libm.a"

	# Instead of sourcing scripts/env.sh riscv s7d s7d_odroidc5 aocpu, export what it does
	run_host_command_logged ARCH=riscv SOC=s7d BOARD=s7d_odroidc5 PRODUCT=aocpu KERNEL=freertos COMPILER=gcc TOOLCHAIN_KEYWORD=riscv-none BACKTRACE_ENABLE=0 make -C "${sdk}" REPO_DIR="${fw_work}/bl30"

	# Pack the FIP
	# The tools are static x86_64 binaries. Run them via qemu on other hosts.
	# Armbian exports QEMU_CPU=cortex-a53 for arm64 targets, which x86_64 qemu rejects, so select a CPU model that exists there.
	declare imagetool="${fw_src}/fip/s7d/binary-tool/acpu-imagetool" blobs="s7d/s905x5m"
	if [[ "$(uname -m)" != "x86_64" ]]; then
		declare qemu_bin="/usr/bin/qemu-x86_64-static"
		[[ -x "${qemu_bin}" ]] || qemu_bin="/usr/bin/qemu-x86_64"
		[[ -x "${qemu_bin}" ]] || exit_with_error "Missing qemu-x86_64-static, needed to pack the ${BOARD} bootloader on $(uname -m)"
		imagetool="QEMU_CPU=max ${qemu_bin} ${imagetool}"
	fi

	function meson_s7d_pad() { # <input> <output> <size>
		[[ $(stat -c %s "$1") -le $3 ]] || exit_with_error "Exceeds ${3} bytes" "$1"
		run_host_command_logged truncate -s "$3" "$2.tmp"
		run_host_command_logged dd if="$1" of="$2.tmp" conv=notrunc status=none
		run_host_command_logged mv "$2.tmp" "$2"
	}
	function meson_s7d_le32() { # <number>: write as 32-bit little-endian
		printf "$(printf '\\x%02x\\x%02x\\x%02x\\x%02x' $(($1 & 255)) $(($1 >> 8 & 255)) $(($1 >> 16 & 255)) $(($1 >> 24 & 255)))"
	}

	# The blobs come with rsa-mldsa device authentication. Convert them to rsa, as the U-Boot config selects it.
	declare authen="--chipset-authen-algorithm=rsa,none --device-authen-algorithm=rsa,none" blobin="--blobin-device-authen-algorithm=rsa,mldsa-draft1" blob
	run_host_command_logged "${imagetool}" create-boot-blobs --scs-family=s7d "${authen}" "${blobin}" \
		--infile-blob-bb1st-ref="${fw_src}/bl2/${blobs}/bb1st.sto.bin.signed.rsa-mldsa.rsa" --outfile-bb1st="${fw_work}/bb1st.sto.bin.signed"
	for blob in bl2e.sto bl2x; do
		run_host_command_logged "${imagetool}" create-boot-blobs --scs-family=s7d "${authen}" "${blobin}" \
			--infile-blob-${blob%.sto}="${fw_src}/bl2/${blobs}/blob-${blob}.bin.signed.rsa-mldsa.rsa" --outfile-blob-${blob%.sto}="${fw_work}/blob-${blob}.bin.signed"
	done
	for blob in bl31 bl32 bl40; do
		run_host_command_logged "${imagetool}" create-device-fip --header-layout=mini --size-payload-bl30=94208 "${authen}" "${blobin}" \
			--infile-blob-${blob}="${fw_src}/${blob}/${blobs}/blob-${blob}.bin.signed.rsa-mldsa.rsa" --outfile-blob-${blob}="${fw_work}/blob-${blob}.bin.signed"
	done

	# BL2 with the device ACS
	declare -a acs=("${PWD}/build/board/amlogic/"*/firmware/acs.bin)
	[[ ${#acs[@]} == 1 && -f "${acs[0]}" ]] || exit_with_error "Device ACS not found" "${acs[*]}"
	meson_s7d_pad "${acs[0]}" "${fw_work}/dvinit-params.bin" 7168
	run_host_command_logged "${imagetool}" create-boot-blobs --scs-family=s7d "${authen}" \
		--infile-template-bb1st="${fw_src}/templates/${blobs}/bb1st.bin.rsa.rsa" --infile-blob-bb1st-ref="${fw_work}/bb1st.sto.bin.signed" \
		--infile-blob-bl2e="${fw_work}/blob-bl2e.sto.bin.signed" --infile-dvinit-params="${fw_work}/dvinit-params.bin" --outfile-bb1st="${fw_work}/bb1st.sto.bin.signed"

	# BL30 and BL33 payloads. BL33 is U-Boot, 4 KiB aligned, with BL33Z appended, zstd compressed, with a "ZSTD"<raw size><compressed size> header.
	meson_s7d_pad "${sdk}/output/riscv-s7d_odroidc5-aocpu/freertos/freertos.bin" "${fw_work}/bl30-payload.bin" 94208
	meson_s7d_pad "${PWD}/build/u-boot.bin" "${fw_work}/bl33.bin" $((($(stat -c %s "${PWD}/build/u-boot.bin") + 4095) / 4096 * 4096))
	run_host_command_logged "cat ${PWD}/bl33z/build/bl33z.bin >> ${fw_work}/bl33.bin"
	run_host_command_logged zstd -q -9 "${fw_work}/bl33.bin" -o "${fw_work}/bl33.bin.zst"
	{
		printf 'ZSTD'
		meson_s7d_le32 "$(stat -c %s "${fw_work}/bl33.bin")"
		meson_s7d_le32 "$(stat -c %s "${fw_work}/bl33.bin.zst")"
		cat "${fw_work}/bl33.bin.zst"
	} > "${fw_work}/bl33.bin.zstd"
	meson_s7d_pad "${fw_work}/bl33.bin.zstd" "${fw_work}/bl33-payload.bin" 1572864

	# Device FIP
	run_host_command_logged "${imagetool}" create-device-fip --header-layout=mini --size-payload-bl30=94208 "${authen}" \
		--infile-template-chipset-fip-header="${fw_src}/templates/${blobs}/device-fip-header.bin.rsa.rsa" \
		--infile-bl30-payload="${fw_work}/bl30-payload.bin" --infile-bl33-payload="${fw_work}/bl33-payload.bin" \
		--infile-blob-bl40="${fw_work}/blob-bl40.bin.signed" --infile-blob-bl31="${fw_work}/blob-bl31.bin.signed" \
		--infile-blob-bl32="${fw_work}/blob-bl32.bin.signed" --outfile-device-fip="${fw_work}/device-fip.bin.signed"

	# Final image: BB1ST with secure boot header, BL2E, BL2X, an empty DDR FIP and the device FIP, each 4 KiB aligned.
	# A table of contents with SHA256 goes into sector 540, the header revision into sector 543.
	meson_s7d_pad "${fw_work}/bb1st.sto.bin.signed" "${fw_work}/bb1st.max" 272384
	run_host_command_logged "${fw_src}/fip/s7d/bin/attach_sbh.sh" "${fw_work}/bb1st.max" "${fw_work}/BBST"
	meson_s7d_pad "${fw_work}/blob-bl2e.sto.bin.signed" "${fw_work}/BL2E" 116912
	meson_s7d_pad "${fw_work}/blob-bl2x.bin.signed" "${fw_work}/BL2X" 108720
	run_host_command_logged truncate -s 262144 "${fw_work}/DDRF"
	run_host_command_logged mv "${fw_work}/device-fip.bin.signed" "${fw_work}/DEVF"
	declare out="${fip_out}/u-boot.bin.signed" toc="${fw_work}/aml-payload.cfg" payload offset=0 size
	{
		printf '@AMLBOOT\x02\x05\x90\x00' # Version 2, 5 payloads, 144 bytes header size, including SHA256
		printf '%-20.20s' "S7D-s905x5m-$(date +%y%m%d%H%M%S)"
	} > "${toc}"
	for payload in BBST BL2E BL2X DDRF DEVF; do
		size=$((($(stat -c %s "${fw_work}/${payload}") + 4095) / 4096 * 4096))
		run_host_command_logged dd if="${fw_work}/${payload}" of="${out}" bs=512 seek=$((offset / 512)) conv=notrunc status=none
		{
			printf '%s' "${payload}"
			meson_s7d_le32 "${offset}"
			meson_s7d_le32 "${size}"
			meson_s7d_le32 0
		} >> "${toc}"
		offset=$((offset + size))
	done
	run_host_command_logged truncate -s "${offset}" "${out}"
	run_host_command_logged "sha256sum ${toc} | cut -c 1-64 | xxd -r -p | cat - ${toc} > ${toc}.sha256"
	run_host_command_logged dd if="${toc}.sha256" of="${out}" bs=512 seek=540 conv=notrunc status=none
	run_host_command_logged dd if="${fw_src}/fip/s7d/bin/hdr_revA" of="${out}" bs=512 seek=543 conv=notrunc status=none

	loop_over_uboot_targets_and_do deploy_built_uboot_bins_for_one_target_to_packaging_area
	declare -g EXTENSION_BUILT_UBOOT="yes"
}

# FIP image starts at sector 1. Sector 0 holds the partition table.
function write_uboot_platform() {
	dd if="$1/u-boot.bin" of="$2" conv=fsync,notrunc seek=1 status=progress
}

# Hardkernel installs the overlays unprefixed to amlogic/overlays/odroidc5/.
# Move them to amlogic/overlays/ without the board subdirectory, and prefix them as the mainline meson64 overlays.
# common_drivers ships its own DVB core (AMLOGIC_DVB_CORE), which exports the same symbols as mainline's DVB_CORE.
# Drop the mainline DVB options Armbian enables by default, else modpost fails with "exported twice".
function custom_kernel_config__meson_s7d_no_mainline_dvb() {
	declare -a keep=()
	declare opt
	for opt in "${opts_y[@]}"; do
		[[ ${opt#CONFIG_} == MEDIA_DIGITAL_TV_SUPPORT || ${opt#CONFIG_} == DVB_* ]] || keep+=("${opt}")
	done
	opts_y=("${keep[@]}")
	keep=()
	for opt in "${opts_m[@]}"; do
		[[ ${opt#CONFIG_} == DVB_* ]] || keep+=("${opt}")
	done
	opts_m=("${keep[@]}")
	opts_n+=('MEDIA_DIGITAL_TV_SUPPORT')
}

# The vendor kernel has the git submodules common_drivers and media_modules, which Armbian's patching does not cover.
# Apply patches from patch/kernel/${KERNELPATCHDIR}-submodules/<submodule>/*.patch to the respective submodule instead.
# The submodules are checked out freshly for every build, and this hook runs before Armbian's patching.
function kernel_copy_extra_sources__meson_s7d_submodule_patches() {
	declare patch_dir="${SRC}/patch/kernel/${KERNELPATCHDIR}-submodules" submodule_dir patch
	[[ -d "${patch_dir}" ]] || return 0
	for submodule_dir in "${patch_dir}"/*/; do
		submodule_dir="${submodule_dir%/}"
		[[ -d "${kernel_work_dir}/${submodule_dir##*/}" ]] || exit_with_error "Submodule for patches not found" "${submodule_dir##*/}"
		for patch in "${submodule_dir}"/*.patch; do
			[[ -f "${patch}" ]] || continue
			display_alert "Applying submodule patch" "${submodule_dir##*/}: ${patch##*/}" "info"
			run_host_command_logged git -C "${kernel_work_dir}/${submodule_dir##*/}" apply --verbose "${patch}"
		done
	done
}

function pre_package_kernel_dtbs__meson_s7d_prefix_overlays() {
	declare overlay_dir="${tmp_kernel_install_dirs[INSTALL_DTBS_PATH]}/amlogic/overlays"
	[[ -d "${overlay_dir}/odroidc5" ]] || return 0
	declare dtbo
	for dtbo in "${overlay_dir}/odroidc5/"*.dtbo; do
		run_host_command_logged mv -v "${dtbo}" "${overlay_dir}/${OVERLAY_PREFIX:-meson-s7d}-${dtbo##*/}"
	done
	run_host_command_logged rmdir -v "${overlay_dir}/odroidc5"
}

# Ship the video decoder firmware of the vendor media_modules with the kernel, as it works with this vendor kernel only.
function pre_package_kernel_image__meson_s7d_vdec_firmware() {
	declare firmware="${kernel_work_dir}/media_modules/firmware/S905X5M/video_ucode.bin"
	[[ -f "${firmware}" ]] || exit_with_error "Video decoder firmware not found" "${firmware}"
	run_host_command_logged install -Dvm 644 "${firmware}" "${tmp_kernel_install_dirs[INSTALL_MOD_PATH]}/lib/firmware/video/video_ucode.bin"
}

# The analog and dummy audio codec drivers have no device table, hence are not loaded automatically.
# Load them along with the sound card driver, which is. Blacklisting amlogic_snd_soc then disables both.
function pre_package_kernel_image__meson_s7d_sound_softdeps() {
	declare modprobe_dir="${tmp_kernel_install_dirs[INSTALL_MOD_PATH]}/lib/modprobe.d"
	run_host_command_logged mkdir -pv "${modprobe_dir}"
	echo 'softdep amlogic_snd_soc pre: amlogic_snd_codec_t9015 amlogic_snd_codec_dummy' > "${modprobe_dir}/meson-s7d-sound.conf"
}

function family_tweaks() {
	:
}
